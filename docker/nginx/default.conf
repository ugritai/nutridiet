server {
    listen 80;
    server_name localhost;

    # 1. IMAGES (New Block)
    # Serves requests like /img/alimentos/verduras.jpg from the mapped volume 
    location /img/ {
        alias /app/static/images/;
        autoindex off;
    }

    location /static/images_recipies/ {
        alias /app/static/images_recipies/;
        autoindex off;
        expires 7d; # Opcional: Cache para mejorar velocidad
        add_header Cache-Control "public, no-transform";
    }

    # 2. API -> Backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. FRONTEND -> Web
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSockets for React Hot Reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}